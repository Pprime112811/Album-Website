<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Prime | Official Website</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080812;
    color: white;
    overflow-x: hidden;
}

/* =========================
   NAVIGATION
========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(8,8,18,0.88);
    backdrop-filter: blur(15px);
    z-index: 1000;
    border-bottom: 2px solid rgba(255,255,255,0.08);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(
        90deg,
        #3498ff,
        #a855f7,
        #ff8a24,
        #43e85b
    );
    -webkit-background-clip: text;
    color: transparent;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 22px;
    font-weight: bold;
    transition: 0.2s;
}

nav a:hover {
    color: #a855f7;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;
    padding: 140px 20px 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
        radial-gradient(circle at 20% 30%, rgba(52,152,255,.35), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(168,85,247,.35), transparent 30%),
        radial-gradient(circle at 30% 80%, rgba(255,138,36,.25), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(67,232,91,.25), transparent 30%),
        #080812;
}

.hero-content {
    max-width: 1000px;
}

.hero h1 {
    font-size: clamp(65px, 13vw, 160px);
    font-weight: 1000;
    letter-spacing: -8px;

    background: linear-gradient(
        90deg,
        #3498ff,
        #a855f7,
        #ff8a24,
        #43e85b
    );

    -webkit-background-clip: text;
    color: transparent;

    animation: glow 4s infinite alternate;
}

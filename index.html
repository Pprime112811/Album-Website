<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Prime | Official Website</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #070711;
    color: white;
    overflow-x: hidden;
}

/* ================================
   TEAM PRIME COLORS
================================ */

:root {
    --blue: #2495ff;
    --purple: #a855f7;
    --orange: #ff8a24;
    --green: #43e85b;
    --dark: #070711;
    --card: #11111d;
}

/* ================================
   NAVIGATION
================================ */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(7, 7, 17, 0.88);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,0.1);

    z-index: 9999;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;

    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.logo-p {
    font-size: 38px;
    font-weight: 1000;

    background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 0 10px rgba(168,85,247,0.6));
}

.nav-links {
    display: flex;
    gap: 24px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

.nav-links a:hover {
    color: var(--purple);
}

/* ================================
   HERO
================================ */

.hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 130px 20px 80px;

    background:
        radial-gradient(circle at 10% 20%, rgba(36,149,255,0.32), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(168,85,247,0.32), transparent 30%),
        radial-gradient(circle at 15% 85%, rgba(255,138,36,0.25), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(67,232,91,0.25), transparent 30%),
        #070711;
}

.hero-content {
    max-width: 1000px;
}

.hero-logo {
    width: 150px;
    height: 150px;

    margin: 0 auto 30px;

    border-radius: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(36,149,255,0.2),
            rgba(168,85,247,0.2),
            rgba(255,138,36,0.2),
            rgba(67,232,91,0.2)
        );

    border: 2px solid rgba(255,255,255,0.15);

    box-shadow:
        0 0 50px rgba(168,85,247,0.25),
        inset 0 0 40px rgba(255,255,255,0.03);
}

.hero-logo span {
    font-size: 105px;
    font-weight: 1000;

    background: linear-gradient(
        135deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero h1 {
    font-size: clamp(55px, 12vw, 145px);
    line-height: 0.9;
    font-weight: 1000;
    letter-spacing: -7px;

    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: titleGlow 4s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from {
        filter: drop-shadow(0 0 4px rgba(168,85,247,0.2));
    }

    to {
        filter: drop-shadow(0 0 22px rgba(168,85,247,0.6));
    }
}

.hero p {
    margin-top: 25px;
    color: #c5c5d1;
    font-size: 21px;
}

.button {
    display: inline-block;

    margin-top: 35px;

    padding: 16px 30px;

    border-radius: 999px;

    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    color: white;

    text-decoration: none;

    font-weight: 900;

    box-shadow: 0 10px 35px rgba(168,85,247,0.25);

    transition: 0.25s;
}

.button:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 15px 45px rgba(168,85,247,0.45);
}

/* ================================
   SECTIONS
================================ */

section {
    width: 100%;
    max-width: 1250px;
    margin: auto;
    padding: 110px 7%;
}

.section-title {
    font-size: clamp(38px, 6vw, 60px);
    margin-bottom: 45px;
    font-weight: 1000;

    background: linear-gradient(
        90deg,
        var(--blue),
        var(--purple),
        var(--orange),
        var(--green)
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* ================================
   ABOUT
================================ */

.about-box {
    padding: 45px;

    border-radius: 28px;

    background: var(--card);

    border: 2px solid transparent;

    background:
        linear-gradient(var(--card), var(--card)) padding-box,
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple),
            var(--orange),
            var(--green)
        ) border-box;

    line-height: 1.8;
    color: #d0d0dc;
}

.about-box h3 {
    color: white;
    font-size: 30px;
    margin-bottom: 15px;
}

.about-box strong {
    color: white;
}

/* ================================
   TEAM
================================ */

.team-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.member {
    background: var(--card);

    padding: 35px 20px;

    border-radius: 24px;

    text-align: center;

    border: 1px solid #252538;

    transition: 0.25s;
}

.member:hover {
    transform: translateY(-8px);
}

.member-icon {
    width: 90px;
    height: 90px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 35px;
    font-weight: 1000;

    color: white;
}

.parker .member-icon {
    background: var(--blue);
    box-shadow: 0 0 30px rgba(36,149,255,0.4);
}

.isla .member-icon {
    background: var(--purple);
    box-shadow: 0 0 30px rgba(168,85,247,0.4);
}

.liam .member-icon {
    background: var(--orange);
    box-shadow: 0 0 30px rgba(255,138,36,0.4);
}

.miles .member-icon {
    background: var(--green);
    box-shadow: 0 0 30px rgba(67,232,91,0.4);
}

.member h3 {
    font-size: 22px;
    margin-bottom: 8px;
}

.member p {
    color: #9898a9;
}

/* ================================
   ALBUM
================================ */

.album {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 60px;

    align-items: start;
}

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:

}
